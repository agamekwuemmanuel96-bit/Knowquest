<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KnowQuest - Legends of Knowledge</title>
<style>
:root{--bg1:#f7faff;--bg2:#e6efff;--line:#d5e1fb;--ink:#0b1b4d;--muted:#5a6a93;--navy:#0b2a7a;--yellow:#fbbf24;--yellowSoft:#fff3c4;--blueSoft:#dbe8ff;--ok:#16a34a;--okSoft:#e3f7ea;--bad:#dc2626;--badSoft:#fde8e8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%) fixed;color:var(--ink);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.4}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 48px}
.view{display:none}
.view.active{display:block}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
header h1{margin:0;font-size:26px;color:var(--navy)}
header small{display:block;color:var(--muted);font-size:13px}
.icon-btn{background:var(--navy);border:none;color:#fff;border-radius:12px;width:44px;height:44px;font-size:20px}
.card{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.profile{display:flex;gap:14px;align-items:center}
.avatar-btn{position:relative;border:none;background:none;padding:0;flex-shrink:0;width:88px;height:88px}
.avatar{width:88px;height:88px;border-radius:18px;display:block;object-fit:cover}
.pencil{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.pinfo{flex:1;min-width:0}
.pinfo h2{margin:0;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:bold;font-size:13px;border-radius:10px;padding:3px 10px;margin:4px 0 8px}
.bar{height:12px;background:var(--blueSoft);border-radius:8px;overflow:hidden}
.fill{height:100%;background:var(--yellow);width:0;transition:width .4s;border-radius:8px}
.aptext{font-size:12px;color:var(--muted);margin-top:6px}
.edit-link{background:none;border:none;color:var(--navy);text-decoration:underline;font-size:13px;font-weight:bold;padding:8px 0 0}
.status-btn{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--navy);color:#fff;border:none;border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:15px}
.status-btn b{color:var(--yellow);font-size:18px}
.main-btn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:14px;padding:16px;font-size:18px;font-weight:bold;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.sec-btn{background:var(--navy);color:#fff;border:none;border-radius:12px;padding:12px 4px;font-size:13px;font-weight:bold}
.wide-btn{width:100%;padding:14px;font-size:15px;margin-bottom:10px}
.ghost-btn{width:100%;background:#fff;color:var(--navy);border:2px solid var(--navy);border-radius:12px;padding:12px;font-size:15px;font-weight:bold;margin-bottom:10px}
h3{margin:18px 0 10px;font-size:17px;color:var(--navy)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:#fff;color:var(--navy);border:1px solid var(--line);border-left:6px solid var(--yellow);border-radius:14px;padding:16px 8px;font-size:15px;font-weight:bold}
.cat:last-child{grid-column:span 2}
.ach{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ach:last-child{border-bottom:none}
.badge{font-size:26px}
.ach small{display:block;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;display:block;margin:8px auto 0}
.back{background:#fff;border:1px solid var(--line);color:var(--navy);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:bold;margin-bottom:14px}
.field{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.fpic{width:96px;height:96px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.fpic svg{width:80px;height:80px}
.fpic.sci{background:var(--blueSoft)}
.fpic.art{background:var(--yellowSoft)}
.ftxt b{display:block;font-size:20px;color:var(--navy);margin-bottom:4px}
.ftxt small{color:var(--muted);font-size:13px;display:block}
.subject{width:100%;text-align:left;background:#fff;color:var(--navy);border:1px solid var(--line);border-left:6px solid var(--yellow);border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:17px;font-weight:bold}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}
.qtype{color:#8a6100;font-weight:bold}
.qbar{height:10px;background:var(--blueSoft);border-radius:8px;overflow:hidden;margin-bottom:14px}
.qbar .fill{background:var(--navy)}
.qtext{font-size:18px;font-weight:bold}
.opt{width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;font-size:16px}
.opt.correct{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.explain{display:none;background:var(--yellowSoft);color:var(--ink);border-left:5px solid var(--yellow);padding:12px;border-radius:8px;margin:6px 0 12px;font-size:15px}
.big{font-size:46px;font-weight:bold;text-align:center;margin:6px 0;color:var(--navy)}
.center{text-align:center}
.apline{color:var(--ink);font-size:20px;font-weight:bold;text-align:center;margin:6px 0}
.small{font-size:13px;color:var(--muted);text-align:center;margin:4px 0}
.up{color:var(--navy);font-weight:bold;text-align:center;margin-top:8px}
.rk{display:flex;justify-content:space-between;align-items:center;background:#fff;color:var(--ink);border-radius:14px;padding:14px 16px;margin-bottom:10px;border:2px solid var(--line)}
.rk b{font-size:17px}
.rk small{display:block;color:var(--muted)}
.rk.here{border-color:var(--yellow);background:var(--yellowSoft)}
.rk .tag{background:var(--navy);color:#fff;border-radius:10px;padding:4px 10px;font-size:12px;font-weight:bold}
.avprev{width:150px;height:150px;margin:0 auto 14px}
.avprev .avatar{width:150px;height:150px;border-radius:24px}
.fieldlabel{display:block;font-weight:bold;margin-bottom:6px}
.nameinput{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:16px;color:var(--ink);font-family:inherit}
.photo-row{display:flex;gap:10px;margin-top:12px}
.photo-row button{flex:1}
.optlabel{font-weight:bold;margin:12px 0 8px}
.optlabel:first-child{margin-top:0}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.sel{box-shadow:0 0 0 3px var(--navy)}
.chip{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:bold}
.chip.sel{border-color:var(--navy);background:var(--blueSoft)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
button{cursor:pointer;font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:bold;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<!-- HOME -->
<div class="view active" id="v-home">
  <header>
    <div>
      <h1>KnowQuest</h1>
      <small>Learn. Evolve. Become Legendary.</small>
    </div>
    <button class="icon-btn" aria-label="Friends (coming later)" onclick="soon('Friends')">&#128101;</button>
  </header>

  <section class="card profile">
    <button class="avatar-btn" id="avhome" aria-label="Edit your name and photo" onclick="openAvatar()"></button>
    <div class="pinfo">
      <h2 id="pname"></h2>
      <div class="rank" id="prank"></div>
      <div class="bar" role="progressbar" aria-label="Progress to next level" id="pbar"><div class="fill" id="pfill"></div></div>
      <div class="aptext" id="aptext"></div>
      <button class="edit-link" onclick="openAvatar()">Edit name and photo</button>
    </div>
  </section>

  <button class="status-btn" onclick="showView('status')"><span>Your status</span><b id="statusname"></b><span>&rsaquo;</span></button>

  <button class="main-btn" onclick="showView('fields')">&#9876;&#65039; Start Learning</button>
  <div class="grid3">
    <button class="sec-btn" onclick="soon('Daily Quest')">Daily Quest</button>
    <button class="sec-btn" onclick="soon('Challenge')">Challenge</button>
    <button class="sec-btn" onclick="soon('Continue Learning')">Continue Learning</button>
  </div>

  <h3>Choose your path</h3>
  <section class="cats">
    <button class="cat" onclick="openFields('ss1')">SS1</button>
    <button class="cat" onclick="openFields('ss2')">SS2</button>
    <button class="cat" onclick="openFields('ss3')">SS3</button>
    <button class="cat" onclick="openFields('waec')">WAEC Preparation</button>
    <button class="cat" onclick="openFields('jamb')">JAMB Preparation</button>
  </section>

  <h3>Badges</h3>
  <section class="card" id="achlist"></section>

  <p class="note">Progress is saved on this phone only, until accounts are added in a later phase.</p>
  <button class="linkbtn" onclick="resetProgress()">Reset my progress</button>
</div>

<!-- SCIENCE OR ARTS -->
<div class="view" id="v-fields">
  <button class="back" onclick="showView('home')">&larr; Back</button>
  <p class="hint" style="margin-top:0">Your class decides your questions.</p>
  <div class="swatches" id="classchips" style="margin-bottom:6px"></div>
  <h3>What do you want to learn?</h3>

  <button class="field" onclick="openField('Science')">
    <div class="fpic sci">
      <svg viewBox="0 0 100 100" role="img" aria-label="Atom">
        <g fill="none" stroke="#0b2a7a" stroke-width="3">
          <ellipse cx="50" cy="50" rx="40" ry="15"/>
          <ellipse cx="50" cy="50" rx="40" ry="15" transform="rotate(60 50 50)"/>
          <ellipse cx="50" cy="50" rx="40" ry="15" transform="rotate(120 50 50)"/>
        </g>
        <circle cx="50" cy="50" r="9" fill="#fbbf24"/>
        <circle cx="90" cy="50" r="5" fill="#0b2a7a"/>
        <circle cx="70" cy="84.6" r="5" fill="#0b2a7a"/>
        <circle cx="30" cy="84.6" r="5" fill="#0b2a7a"/>
      </svg>
    </div>
    <div class="ftxt"><b>Science</b><small>Mathematics, Physics, Chemistry, Biology, Agricultural Science</small></div>
  </button>

  <button class="field" onclick="openField('Arts')">
    <div class="fpic art">
      <svg viewBox="0 0 100 100" role="img" aria-label="Painter's palette">
        <ellipse cx="50" cy="54" rx="42" ry="34" fill="#ffffff" stroke="#0b2a7a" stroke-width="3"/>
        <circle cx="66" cy="68" r="7" fill="#fff3c4" stroke="#0b2a7a" stroke-width="3"/>
        <circle cx="30" cy="42" r="7" fill="#0b2a7a"/>
        <circle cx="48" cy="30" r="7" fill="#fbbf24"/>
        <circle cx="68" cy="38" r="7" fill="#e11d48"/>
        <circle cx="28" cy="62" r="7" fill="#16a34a"/>
      </svg>
    </div>
    <div class="ftxt"><b>Arts</b><small>English, Literature, Government, Economics, Geography, Civic Education, Commerce</small></div>
  </button>
</div>

<!-- SUBJECTS -->
<div class="view" id="v-subjects">
  <button class="back" onclick="showView('fields')">&larr; Back</button>
  <h3 style="margin-top:0" id="fieldtitle"></h3>
  <p class="hint" id="subnote"></p>
  <div id="sublist"></div>
</div>

<!-- QUIZ -->
<div class="view" id="v-quiz">
  <button class="back" onclick="quitQuiz()">&larr; Quit quiz</button>
  <div class="qmeta"><span id="qcount"></span><span class="qtype" id="qtype"></span></div>
  <div class="qbar"><div class="fill" id="qfill"></div></div>
  <div class="card"><div class="qtext" id="qtext"></div></div>
  <div id="opts"></div>
  <div class="explain" id="explain"></div>
  <button class="main-btn" id="nextbtn" style="display:none" onclick="nextQ()">Next</button>
</div>

<!-- RESULTS -->
<div class="view" id="v-results">
  <div class="card">
    <div class="small" id="rsubject"></div>
    <div class="big" id="rscore"></div>
    <div class="center" id="rmsg"></div>
    <div class="apline" id="rap"></div>
    <div class="small" id="rdetail"></div>
    <div class="up" id="rlevel"></div>
    <div class="up" id="rbadge"></div>
  </div>
  <button class="main-btn" onclick="retry()">Try again</button>
  <button class="ghost-btn" onclick="backToSubjects()">Choose another subject</button>
  <button class="ghost-btn" onclick="showView('home')">Back to dashboard</button>
</div>

<!-- STATUS -->
<div class="view" id="v-status">
  <button class="back" onclick="showView('home')">&larr; Back</button>
  <h3 style="margin-top:0">Your status</h3>
  <div id="statuslist"></div>
  <p class="note">There are 30 levels. Level 30 needs 20,000 AP.</p>
</div>

<!-- EDIT NAME, PHOTO, AVATAR -->
<div class="view" id="v-avatar">
  <button class="back" onclick="showView('home')">&larr; Back</button>
  <div class="card">
    <div id="avprev" class="avprev"></div>
    <label class="fieldlabel" for="avname">Your name</label>
    <input id="avname" class="nameinput" maxlength="16" placeholder="Type your name">
    <div class="photo-row">
      <button class="sec-btn" onclick="document.getElementById('photoinput').click()">Upload photo</button>
      <button class="ghost-btn" id="rmphoto" style="display:none;margin-bottom:0" onclick="removePhoto()">Remove photo</button>
    </div>
    <input type="file" id="photoinput" accept="image/*" style="display:none" onchange="handlePhoto(this)">
  </div>
  <div class="card">
    <p class="hint" id="avhint"></p>
    <div id="avopts"></div>
  </div>
  <button class="main-btn" onclick="saveAvatar()">Save</button>
</div>

</div>
<div id="toast"></div>

<script>
// ===== SETTINGS (easy to change later) =====
var QUIZ_LENGTH = 10;      // questions per quiz
// AP for each correct answer is set per class in CLASSES below
var AP_QUEST_BONUS = 10;   // bonus AP for completing a quest (at least half correct)
var MAX_LEVEL = 30;
var MAX_AP = 20000;        // AP needed for the highest level
var SAVE_KEY = "knowquest_v2";

// Each class has its own questions. "ap" is the AP earned for each correct answer.
var CLASSES = {
  ss1: { label: "SS1", ap: 3, exam: false },
  ss2: { label: "SS2", ap: 3, exam: false },
  ss3: { label: "SS3", ap: 3, exam: false },
  waec: { label: "WAEC Prep", ap: 5, exam: true },
  jamb: { label: "JAMB Prep", ap: 5, exam: true }
};
var CLASS_ORDER = ["ss1", "ss2", "ss3", "waec", "jamb"];

var SUBJECTS = [
  { id: "mathematics", name: "Mathematics", group: "Science" },
  { id: "physics", name: "Physics", group: "Science" },
  { id: "chemistry", name: "Chemistry", group: "Science" },
  { id: "biology", name: "Biology", group: "Science" },
  { id: "agric", name: "Agricultural Science", group: "Science" },
  { id: "english", name: "English Language", group: "Arts" },
  { id: "literature", name: "Literature in English", group: "Arts" },
  { id: "government", name: "Government", group: "Arts" },
  { id: "economics", name: "Economics", group: "Arts" },
  { id: "geography", name: "Geography", group: "Arts" },
  { id: "civic", name: "Civic Education", group: "Arts" },
  { id: "commerce", name: "Commerce", group: "Arts" }
];

var RANKS = [
  { name: "Beginner", from: 1 },
  { name: "Learner", from: 5 },
  { name: "Explorer", from: 9 },
  { name: "Scholar", from: 13 },
  { name: "Pro", from: 17 },
  { name: "Expert", from: 21 },
  { name: "Master", from: 25 },
  { name: "Legend", from: 30 }
];

var BADGES = [
  { id: "first", icon: "\uD83C\uDFC1", title: "First Quest", text: "Finished your first quiz",
    test: function (p, r) { return p.quizzes >= 1; } },
  { id: "perfect", icon: "\uD83C\uDFAF", title: "Perfect Score", text: "Got every question right",
    test: function (p, r) { return r.score === r.total; } },
  { id: "level5", icon: "\u2B50", title: "Rising Star", text: "Reached Level 5",
    test: function (p, r) { return getLevel(p.ap) >= 5; } },
  { id: "ten", icon: "\uD83D\uDCDA", title: "Dedicated", text: "Finished 10 quizzes",
    test: function (p, r) { return p.quizzes >= 10; } }
];

// ===== AVATAR PARTS =====
var SKINS = ["#f3d2b3", "#e0a977", "#c68a5a", "#9a6137", "#7a4a2a", "#523019"];
var HAIRS = ["#1b1b1b", "#4b2e1e", "#7a3b1e", "#d4a017", "#2563eb", "#dc2626"];
var OUTFITS = ["#ffffff", "#fbbf24", "#2563eb", "#dc2626", "#16a34a", "#7c3aed"];
var BGS = ["#1e3a8a", "#7f1d1d", "#14532d", "#4c1d95", "#0f766e", "#334155"];
var STYLES = ["Short", "Afro", "Long", "Bun", "Bald"];

function avatarMarkup(a, cls) {
  var skin = SKINS[a.skin], hair = HAIRS[a.hair], outfit = OUTFITS[a.outfit], bg = BGS[a.bg], st = a.style;
  var s = '<rect width="100" height="100" fill="' + bg + '"/>';
  if (st === 1) { s += '<circle cx="50" cy="30" r="26" fill="' + hair + '"/>'; }
  if (st === 2) { s += '<rect x="26" y="22" width="48" height="52" rx="16" fill="' + hair + '"/>'; }
  if (st === 3) { s += '<circle cx="50" cy="13" r="9" fill="' + hair + '"/>'; }
  s += '<rect x="43" y="56" width="14" height="16" fill="' + skin + '"/>';
  s += '<rect x="43" y="56" width="14" height="8" fill="#000" opacity="0.12"/>';
  s += '<path d="M12 100 Q50 60 88 100 Z" fill="' + outfit + '"/>';
  s += '<path d="M41 72 Q50 84 59 72" stroke="#0b1b4d" stroke-width="2" fill="none" opacity="0.35"/>';
  s += '<circle cx="50" cy="42" r="19" fill="' + skin + '"/>';
  if (st === 0 || st === 2 || st === 3) {
    s += '<path d="M30 40 Q32 18 50 18 Q68 18 70 40 Q60 28 50 28 Q40 28 30 40Z" fill="' + hair + '"/>';
  }
  s += '<circle cx="43" cy="44" r="2.2" fill="#1b1b1b"/><circle cx="57" cy="44" r="2.2" fill="#1b1b1b"/>';
  s += '<path d="M43 52 Q50 57 57 52" stroke="#1b1b1b" stroke-width="2" fill="none" stroke-linecap="round"/>';
  return '<svg class="' + cls + '" viewBox="0 0 100 100" role="img" aria-label="Your avatar">' + s + '</svg>';
}

function photoMarkup(src, cls) {
  return '<img class="' + cls + '" src="' + src + '" alt="Your photo">';
}

// Question files in the "questions" folder call this to hand over their questions.
var BANK = {};
function registerQuestions(id, list) { BANK[id] = list; }

function getQuestions(key, done) {
  if (BANK[key]) { done(BANK[key]); return; }
  var s = document.createElement("script");
  s.src = "questions/" + key + ".js";
  s.onload = function () { done(BANK[key] || null); };
  s.onerror = function () { done(null); };
  document.head.appendChild(s);
}

// ===== PLAYER DATA =====
var DEFAULT_PLAYER = {
  name: "Player One", ap: 0, quizzes: 0, badges: [], photo: "", cls: "ss1",
  avatar: { skin: 1, style: 0, hair: 0, outfit: 1, bg: 0 }
};
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function loadPlayer() {
  var p = clone(DEFAULT_PLAYER);
  try {
    var s = localStorage.getItem(SAVE_KEY);
    if (s) {
      var saved = JSON.parse(s);
      for (var k in saved) { p[k] = saved[k]; }
    }
  } catch (e) {}
  if (!CLASSES[p.cls]) { p.cls = "ss1"; }
  return p;
}
function savePlayer() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(player));
  } catch (e) {
    toast("Could not save on this phone. Storage may be full.");
  }
}
var player = loadPlayer();
var run = null;
var draft = null;
var draftPhoto = "";

function resetProgress() {
  if (!confirm("Reset all your progress, name and photo on this phone?")) { return; }
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  player = clone(DEFAULT_PLAYER);
  renderHome();
  toast("Progress reset");
}

// ===== LEVELS AND STATUS =====
// Level 1 starts at 0 AP and level 30 needs 20,000 AP. Each level needs more than the last.
function apForLevel(l) {
  if (l <= 1) { return 0; }
  if (l >= MAX_LEVEL) { return MAX_AP; }
  return Math.round(MAX_AP * Math.pow((l - 1) / (MAX_LEVEL - 1), 2));
}
function getLevel(ap) {
  var l = 1;
  while (l < MAX_LEVEL && ap >= apForLevel(l + 1)) { l++; }
  return l;
}
function getRank(level) {
  var r = RANKS[0];
  for (var i = 0; i < RANKS.length; i++) { if (level >= RANKS[i].from) { r = RANKS[i]; } }
  return r;
}

// ===== SCREENS =====
function showView(name) {
  var views = document.querySelectorAll(".view");
  for (var i = 0; i < views.length; i++) { views[i].classList.remove("active"); }
  document.getElementById("v-" + name).classList.add("active");
  if (name === "home") { renderHome(); }
  if (name === "status") { renderStatus(); }
  if (name === "fields") { renderClassChips(); }
  window.scrollTo(0, 0);
}

function renderHome() {
  var level = getLevel(player.ap);
  var rank = getRank(level);
  var pct, txt;
  if (level >= MAX_LEVEL) {
    pct = 100;
    txt = player.ap + " AP \u2022 Highest level reached";
  } else {
    var s = apForLevel(level), n = apForLevel(level + 1);
    pct = Math.round((player.ap - s) / (n - s) * 100);
    txt = player.ap + " AP \u2022 " + (n - player.ap) + " AP to Level " + (level + 1);
  }
  var pic = player.photo ? photoMarkup(player.photo, "avatar") : avatarMarkup(player.avatar, "avatar");
  document.getElementById("avhome").innerHTML = pic + '<span class="pencil">&#9998;</span>';
  document.getElementById("pname").textContent = player.name;
  document.getElementById("prank").textContent = "Level " + level + " \u2022 " + rank.name;
  document.getElementById("pfill").style.width = pct + "%";
  document.getElementById("pbar").setAttribute("aria-valuenow", pct);
  document.getElementById("aptext").textContent = txt;
  document.getElementById("statusname").textContent = rank.name;
  renderBadges();
}

function renderBadges() {
  var list = document.getElementById("achlist");
  list.innerHTML = "";
  var count = 0;
  BADGES.forEach(function (b) {
    if (player.badges.indexOf(b.id) === -1) { return; }
    count++;
    var row = document.createElement("div");
    row.className = "ach";
    row.innerHTML = '<span class="badge">' + b.icon + '</span><div><b>' + b.title + '</b><small>' + b.text + '</small></div>';
    list.appendChild(row);
  });
  if (count === 0) {
    var p = document.createElement("div");
    p.className = "empty";
    p.textContent = "No badges yet. Finish a quiz to earn your first one.";
    list.appendChild(p);
  }
}

function renderStatus() {
  var box = document.getElementById("statuslist");
  box.innerHTML = "";
  var level = getLevel(player.ap);
  var current = getRank(level);
  RANKS.forEach(function (r, i) {
    var next = RANKS[i + 1];
    var range = next ? ("Level " + r.from + (next.from - 1 > r.from ? "-" + (next.from - 1) : "")) : ("Level " + r.from);
    var row = document.createElement("div");
    row.className = "rk" + (r.name === current.name ? " here" : "");
    row.innerHTML = '<div><b>' + r.name + '</b><small>' + range + ' \u2022 from ' + apForLevel(r.from) + ' AP</small></div>' +
      (r.name === current.name ? '<span class="tag">You are here</span>' : '');
    box.appendChild(row);
  });
}

// ===== CLASS CHOICE =====
function renderClassChips() {
  var box = document.getElementById("classchips");
  box.innerHTML = "";
  CLASS_ORDER.forEach(function (k) {
    var b = document.createElement("button");
    b.className = "chip" + (player.cls === k ? " sel" : "");
    b.textContent = CLASSES[k].label;
    b.onclick = function () { player.cls = k; savePlayer(); renderClassChips(); };
    box.appendChild(b);
  });
}

function openFields(k) {
  player.cls = k;
  savePlayer();
  showView("fields");
}

// ===== SUBJECTS AND QUIZ =====
function openField(group) {
  document.getElementById("fieldtitle").textContent = CLASSES[player.cls].label + " \u2022 " + group;
  document.getElementById("subnote").textContent = CLASSES[player.cls].exam
    ? "Exam-style practice questions written for KnowQuest. They are not official WAEC or JAMB past questions."
    : "";
  var box = document.getElementById("sublist");
  box.innerHTML = "";
  SUBJECTS.forEach(function (s) {
    if (s.group !== group) { return; }
    var b = document.createElement("button");
    b.className = "subject";
    b.textContent = s.name;
    b.onclick = function () { chooseSubject(s); };
    box.appendChild(b);
  });
  showView("subjects");
}

function backToSubjects() {
  if (run) { openField(run.subject.group); } else { showView("fields"); }
}

function chooseSubject(s) {
  var cls = player.cls;
  toast("Loading " + s.name + "...");
  getQuestions(s.id + "-" + cls, function (list) {
    if (!list || !list.length) { toast(CLASSES[cls].label + " " + s.name + " questions are coming soon"); return; }
    startQuiz(s, list, cls);
  });
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function startQuiz(subject, bank, cls) {
  var list = shuffle(bank).slice(0, QUIZ_LENGTH).map(function (q) {
    var opts = q.options.map(function (t, i) { return { t: t, c: i === q.answer }; });
    return { type: q.type, q: q.q, why: q.why, opts: shuffle(opts) };
  });
  run = { subject: subject, bank: bank, cls: cls, list: list, idx: 0, score: 0, locked: false };
  showView("quiz");
  renderQuestion();
}

function renderQuestion() {
  var q = run.list[run.idx];
  run.locked = false;
  document.getElementById("qcount").textContent = run.subject.name + " \u2022 Question " + (run.idx + 1) + " of " + run.list.length;
  document.getElementById("qtype").textContent = q.type;
  document.getElementById("qfill").style.width = (run.idx / run.list.length * 100) + "%";
  document.getElementById("qtext").textContent = q.q;
  var box = document.getElementById("opts");
  box.innerHTML = "";
  q.opts.forEach(function (o, i) {
    var b = document.createElement("button");
    b.className = "opt";
    b.textContent = o.t;
    b.onclick = function () { pick(i); };
    box.appendChild(b);
  });
  document.getElementById("explain").style.display = "none";
  document.getElementById("nextbtn").style.display = "none";
  window.scrollTo(0, 0);
}

function pick(i) {
  if (run.locked) { return; }
  run.locked = true;
  var q = run.list[run.idx];
  var btns = document.getElementById("opts").children;
  for (var k = 0; k < btns.length; k++) {
    if (q.opts[k].c) { btns[k].classList.add("correct"); }
  }
  if (q.opts[i].c) { run.score++; } else { btns[i].classList.add("wrong"); }
  var ex = document.getElementById("explain");
  ex.textContent = (q.opts[i].c ? "Correct! " : "Not quite. ") + q.why;
  ex.style.display = "block";
  var nb = document.getElementById("nextbtn");
  nb.textContent = (run.idx === run.list.length - 1) ? "See results" : "Next";
  nb.style.display = "block";
}

function nextQ() {
  if (run.idx === run.list.length - 1) { finish(); return; }
  run.idx++;
  renderQuestion();
}

function quitQuiz() {
  var group = run.subject.group;
  run = null;
  openField(group);
}

function finish() {
  var total = run.list.length, score = run.score;
  var perQ = CLASSES[run.cls].ap;
  var earned = score * perQ;
  var completed = score * 2 >= total;
  if (completed) { earned += AP_QUEST_BONUS; }
  var levelBefore = getLevel(player.ap);
  var rankBefore = getRank(levelBefore).name;
  player.ap += earned;
  player.quizzes += 1;
  var levelAfter = getLevel(player.ap);
  var rankAfter = getRank(levelAfter).name;
  var fresh = [];
  BADGES.forEach(function (b) {
    if (player.badges.indexOf(b.id) === -1 && b.test(player, { score: score, total: total })) {
      player.badges.push(b.id);
      fresh.push(b.title);
    }
  });
  savePlayer();

  document.getElementById("rsubject").textContent = CLASSES[run.cls].label + " \u2022 " + run.subject.name;
  document.getElementById("rscore").textContent = score + " / " + total;
  var msg = "Keep practising, you will get there!";
  if (score === total) { msg = "Perfect score! Legendary work!"; }
  else if (score * 10 >= total * 7) { msg = "Great job! Read the explanations to master the rest."; }
  else if (completed) { msg = "Good effort. Try again to improve."; }
  document.getElementById("rmsg").textContent = msg;
  document.getElementById("rap").textContent = "+" + earned + " AP earned";
  var detail = score + " correct x " + perQ + " AP";
  if (completed) { detail += " + " + AP_QUEST_BONUS + " AP quest bonus"; }
  else { detail += ". Get at least half right to earn the " + AP_QUEST_BONUS + " AP quest bonus."; }
  document.getElementById("rdetail").textContent = detail;
  var lv = "";
  if (levelAfter > levelBefore) { lv = "LEVEL UP! You are now Level " + levelAfter; }
  if (rankAfter !== rankBefore) { lv += (lv ? " \u2022 " : "") + "New status: " + rankAfter; }
  document.getElementById("rlevel").textContent = lv;
  document.getElementById("rbadge").textContent = fresh.length ? "New badge: " + fresh.join(", ") : "";
  showView("results");
}

function retry() { startQuiz(run.subject, run.bank, run.cls); }

// ===== EDIT NAME, PHOTO AND AVATAR =====
function openAvatar() {
  draft = clone(player.avatar);
  draftPhoto = player.photo || "";
  document.getElementById("avname").value = player.name;
  renderAvatar();
  showView("avatar");
}

function renderAvatar() {
  var prev = draftPhoto ? photoMarkup(draftPhoto, "avatar") : avatarMarkup(draft, "avatar");
  document.getElementById("avprev").innerHTML = prev;
  document.getElementById("rmphoto").style.display = draftPhoto ? "block" : "none";
  document.getElementById("avhint").textContent = draftPhoto
    ? "Your photo is showing. Remove it to use a built avatar instead."
    : "No photo? Build your own avatar below.";
  var box = document.getElementById("avopts");
  box.innerHTML = "";
  addSwatches(box, "Skin tone", "skin", SKINS);
  addChips(box, "Hairstyle", "style", STYLES);
  addSwatches(box, "Hair colour", "hair", HAIRS);
  addSwatches(box, "Outfit", "outfit", OUTFITS);
  addSwatches(box, "Background", "bg", BGS);
}

function handlePhoto(input) {
  var file = input.files && input.files[0];
  if (!file) { return; }
  if (file.type.indexOf("image/") !== 0) { toast("Please choose a picture"); input.value = ""; return; }
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      // Shrink the photo to a small square so it saves quickly and uses little space
      var size = 160;
      var c = document.createElement("canvas");
      c.width = size;
      c.height = size;
      var m = Math.min(img.width, img.height);
      var sx = (img.width - m) / 2;
      var sy = (img.height - m) / 2;
      c.getContext("2d").drawImage(img, sx, sy, m, m, 0, 0, size, size);
      draftPhoto = c.toDataURL("image/jpeg", 0.8);
      renderAvatar();
      toast("Photo added. Tap Save to keep it.");
    };
    img.onerror = function () { toast("That picture could not be opened. Try another one."); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  input.value = "";
}

function removePhoto() {
  draftPhoto = "";
  renderAvatar();
}

function addLabel(box, text) {
  var h = document.createElement("div");
  h.className = "optlabel";
  h.textContent = text;
  box.appendChild(h);
}

function addSwatches(box, label, key, colors) {
  addLabel(box, label);
  var row = document.createElement("div");
  row.className = "swatches";
  colors.forEach(function (c, i) {
    var b = document.createElement("button");
    b.className = "sw" + (draft[key] === i ? " sel" : "");
    b.style.background = c;
    b.setAttribute("aria-label", label + " " + (i + 1));
    b.onclick = function () { draft[key] = i; renderAvatar(); };
    row.appendChild(b);
  });
  box.appendChild(row);
}

function addChips(box, label, key, names) {
  addLabel(box, label);
  var row = document.createElement("div");
  row.className = "swatches";
  names.forEach(function (n, i) {
    var b = document.createElement("button");
    b.className = "chip" + (draft[key] === i ? " sel" : "");
    b.textContent = n;
    b.onclick = function () { draft[key] = i; renderAvatar(); };
    row.appendChild(b);
  });
  box.appendChild(row);
}

function saveAvatar() {
  var name = document.getElementById("avname").value.replace(/^\s+|\s+$/g, "");
  player.name = name ? name.substring(0, 16) : "Player One";
  player.avatar = draft;
  player.photo = draftPhoto;
  savePlayer();
  showView("home");
  toast("Saved");
}

// ===== MESSAGES =====
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._t);
  window._t = setTimeout(function () { t.classList.remove("show"); }, 2200);
}
function soon(label) { toast(label + " is coming in a later update"); }

renderHome();
</script>
